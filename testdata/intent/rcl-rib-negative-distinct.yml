version: hoyan/v1

vars:
  changed_prefix: 10.4.0.0/16
  edges: [bj-edge1, sh-edge1, gz-edge1]

snapshots:
  post:
    lab: labs/intent-change-after

scenarios:
  post:
    snapshot: post

intents:
  - name: changed-prefix-single-nexthop-fails
    check:
      table: rib
      scenario: post
      where:
        prefix: ${changed_prefix}
        device_in: ${edges}
        selected: true
      group_by: [device]
      assert:
        distinct_count:
          field: nexthop
          gte: 2
