version: hoyan/v1

snapshots:
  current:
    lab: labs/base-wan

scenarios:
  normal:
    snapshot: current

intents:
  - name: guard-premise-true-inner-passes
    scenario: normal
    rcl:
      guard:
        where:
          device: bj-edge1
          prefix: 10.4.0.0/16
        intent:
          rib_eval:
            aggregate: count()
            gte: 1

  - name: guard-premise-false-vacuous-pass
    scenario: normal
    rcl:
      guard:
        where:
          device: non-existent-router
        intent:
          rib_eval:
            aggregate: count()
            gte: 999

  - name: guard-premise-true-inner-fails
    scenario: normal
    rcl:
      guard:
        where:
          device: bj-edge1
          prefix: 10.4.0.0/16
        intent:
          rib_eval:
            aggregate: count()
            gte: 999
