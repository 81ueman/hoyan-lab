version: hoyan/v1

vars:
  sources: [cust-bj, cust-sh, cust-gz]
  service_prefix: 10.4.0.0/16

snapshots:
  current:
    lab: labs/base-wan

scenarios:
  normal:
    snapshot: current

intents:
  - name: customer-http-denied
    scenario: normal
    forall:
      src: ${sources}
    rcl:
      rib_eval:
        where:
          device: ${src}
          prefix: ${service_prefix}
        aggregate: count()
        gte: 1
