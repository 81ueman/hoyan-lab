version: hoyan/v1

vars:
  changed_prefix: 10.4.0.0/16
  edges: [bj-edge1, sh-edge1, gz-edge1]

snapshots:
  post:
    lab: labs/intent-change-after

scenarios:
  post:
    snapshot: post

intents:
  - name: logical-and-selects-edge-routes
    scenario: post
    rcl:
      rib_eval:
        where:
          device_in: ${edges}
          prefix: ${changed_prefix}
          selected: true
        aggregate: count()
        eq: [3]

  - name: logical-or-selects-static-and-connected
    scenario: post
    rcl:
      rib_eval:
        where:
          and:
            - device: bj-edge1
            - or:
                - protocol: static
                - protocol: connected
        aggregate: count()
        gte: 1

  - name: logical-not-excludes-changed-prefix
    scenario: post
    rcl:
      rib_eval:
        where:
          and:
            - device_in: ${edges}
            - not:
                prefix: ${changed_prefix}
        aggregate: count()
        gte: 3

  - name: prefix-within-matches-child-space
    scenario: post
    rcl:
      rib_eval:
        where:
          device_in: ${edges}
          prefix: ${changed_prefix}
        aggregate: count()
        eq: [3]
