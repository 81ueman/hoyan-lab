version: hoyan/v1

vars:
  service_ip: 10.4.1.10
  customers: [cust-bj, cust-sh, cust-gz]

snapshots:
  current:
    lab: labs/base-wan

scenarios:
  normal:
    snapshot: current

intents:
  - name: customers-http-denied
    scenario: normal
    forall:
      src: ${customers}
    rcl:
      packet_reachable:
        from: ${src}
        to: ${service_ip}
        protocol: tcp
        dst_port: 80
        expect: false

  - name: customers-https-allowed
    scenario: normal
    forall:
      src: ${customers}
    rcl:
      packet_reachable:
        from: ${src}
        to: ${service_ip}
        protocol: tcp
        dst_port: 443
        expect: true
