version: hoyan/v1

snapshots:
  current:
    lab: labs/base-wan

scenarios:
  normal:
    snapshot: current

intents:
  # communities contains の例
  - name: route-has-specific-community
    scenario: normal
    rcl:
      rib_eval:
        where:
          communities:
            contains: "65000:100"
        aggregate: count()
        eq: [0]

  # as_path matches の例（正規表現）
  - name: aspath-matches-regex
    scenario: normal
    rcl:
      rib_eval:
        where:
          as_path:
            matches: ".*99999.*"
        aggregate: count()
        eq: [0]

  # nexthop where predicate (string match)
  - name: nexthop-filter-basic
    scenario: normal
    rcl:
      rib_eval:
        where:
          nexthop: "10.255.1.1"
        aggregate: count()
        gte: 0

  # nexthop where predicate with contains operator
  - name: nexthop-filter-contains
    scenario: normal
    rcl:
      rib_eval:
        where:
          nexthop:
            contains: "10.255"
        aggregate: count()
        gte: 0

  # where内のimply
  - name: if-device-is-edge-then-has-service-prefix
    scenario: normal
    rcl:
      rib_eval:
        where:
          imply:
            - device_in: [bj-edge1, sh-edge1, gz-edge1]
            - prefix: 10.4.0.0/16
        aggregate: count()
        gte: 1
