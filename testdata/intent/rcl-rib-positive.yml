version: hoyan/v1

vars:
  changed_prefix: 10.4.0.0/16
  edges: [bj-edge1, sh-edge1, gz-edge1]

snapshots:
  pre:
    lab: labs/intent-change-before
  post:
    lab: labs/intent-change-after

scenarios:
  normal:
    snapshot: pre
  post:
    snapshot: post

intents:
  - name: unrelated-routes-unchanged
    rcl:
      rib_eq:
        left: pre
        right: post
        where:
          not:
            prefix: ${changed_prefix}

  - name: changed-prefix-has-routes-on-each-edge
    scenario: post
    forall:
      edge: ${edges}
    rcl:
      rib_eval:
        where:
          device: ${edge}
          prefix: ${changed_prefix}
          selected: true
        aggregate: count()
        gte: 1

  - name: changed-prefix-nexthop-diversity
    scenario: post
    rcl:
      rib_eval:
        where:
          prefix: ${changed_prefix}
          device_in: ${edges}
          selected: true
        aggregate: distCnt(nexthop)
        gte: 1

  - name: changed-prefix-local-pref-default
    scenario: post
    rcl:
      rib_eval:
        where:
          prefix: ${changed_prefix}
          device_in: ${edges}
          selected: true
        aggregate: distVals(local_pref)
        eq: [[0]]
