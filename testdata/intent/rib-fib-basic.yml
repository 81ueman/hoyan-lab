version: hoyan/v1

vars:
  service_prefix: 10.4.0.0/16
  edges: [bj-edge1, sh-edge1, gz-edge1]

snapshots:
  current:
    lab: labs/base-wan

scenarios:
  normal:
    snapshot: current

intents:
  - name: service-prefix-visible-on-edges
    scenario: normal
    forall:
      edge: ${edges}
    rcl:
      rib_eval:
        where:
          device: ${edge}
          prefix: ${service_prefix}
        aggregate: count()
        gte: 1

  - name: service-prefix-installed-on-edges
    scenario: normal
    forall:
      edge: ${edges}
    rcl:
      rib_eval:
        where:
          device: ${edge}
          prefix: ${service_prefix}
        aggregate: count()
        gte: 1
