version: hoyan/v1

vars:
  service_ip: 10.4.1.10
  customers: [cust-bj, cust-sh, cust-gz]

snapshots:
  current:
    lab: labs/base-wan

scenarios:
  one-link-failure:
    snapshot: current
    failures:
      max: 1

intents:
  # HTTPSが1本のリンク障害に耐えられるか検証
  # → cust-hz直近のリンクが落ちると到達不能になるので fail になる
  - name: customers-https-not-all-single-link-failures
    scenario: one-link-failure
    forall:
      src: ${customers}
    rcl:
      packet_reachable:
        from: ${src}
        to: ${service_ip}
        protocol: tcp
        dst_port: 443
        expect: false
