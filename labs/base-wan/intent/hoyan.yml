version: hoyan/v1

vars:
  service_ip: 10.4.1.10
  service_prefix: 10.4.0.0/16
  customers: [cust-bj, cust-sh, cust-gz]
  edges: [bj-edge1, sh-edge1, gz-edge1]

snapshots:
  current:
    lab: labs/base-wan

scenarios:
  normal:
    snapshot: current

  one-core-link-failure:
    snapshot: current
    failures:
      max: 1
      include_link_roles: [core]

intents:
  - name: service-prefix-visible-on-edges
    forall:
      edge: ${edges}
    check:
      table: rib
      scenario: normal
      where:
        device: ${edge}
        prefix: ${service_prefix}
      assert:
        exists: true

  - name: customers-http-denied
    forall:
      src: ${customers}
    check:
      table: packet
      scenario: normal
      packet:
        from: ${src}
        to: ${service_ip}
        protocol: tcp
        dst_port: 80
      assert:
        reachable: false

  - name: customers-https-allowed
    forall:
      src: ${customers}
    check:
      table: packet
      scenario: normal
      packet:
        from: ${src}
        to: ${service_ip}
        protocol: tcp
        dst_port: 443
      assert:
        reachable: true
