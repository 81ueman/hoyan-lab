version: hoyan/v1

vars:
  service_ip: 10.4.1.10
  service_prefix: 10.4.0.0/16
  customers: [cust-bj, cust-sh, cust-gz]
  edges: [bj-edge1, sh-edge1, gz-edge1]

snapshots:
  current:
    lab: labs/base-wan

scenarios:
  normal:
    snapshot: current

  one-core-link-failure:
    snapshot: current
    failures:
      max: 1
      include_link_roles: [core]

intents:
  - name: service-prefix-visible-on-edges
    scenario: normal
    forall:
      edge: ${edges}
    rcl:
      rib_eval:
        where:
          device: ${edge}
          prefix: ${service_prefix}
        aggregate: count()
        gte: 1

  - name: customers-http-denied
    scenario: normal
    forall:
      src: ${customers}
    rcl:
      packet_reachable:
        from: ${src}
        to: ${service_ip}
        protocol: tcp
        dst_port: 80
        expect: false

  - name: customers-https-allowed
    scenario: normal
    forall:
      src: ${customers}
    rcl:
      packet_reachable:
        from: ${src}
        to: ${service_ip}
        protocol: tcp
        dst_port: 443
        expect: true
