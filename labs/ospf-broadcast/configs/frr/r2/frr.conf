frr version 10.6.1
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.2.2/32
!
interface eth1
 ip address 198.51.100.2/29
 ip ospf cost 20
 ip ospf network broadcast
 ip ospf mtu-ignore
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
router ospf
 ospf router-id 10.255.2.2
 passive-interface lo
 network 10.255.2.2/32 area 0
 network 198.51.100.0/29 area 0
!
