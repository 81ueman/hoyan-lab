route_checks:
  - name: r1-to-r4-loopback-through-broadcast
    from: r1
    prefix: 10.255.4.4/32
    max_failures: 0
  - name: r4-to-r1-loopback-through-broadcast
    from: r4
    prefix: 10.255.1.1/32
    max_failures: 0
  - name: r2-learns-r3-loopback-on-shared-segment
    from: r2
    prefix: 10.255.3.3/32
    max_failures: 0
packet_checks:
  - name: r1-to-r4-loopback-icmp
    from: r1
    to: 10.255.4.4
    protocol: icmp
    expect_reachable: true
    max_failures: 0
  - name: r4-to-r2-loopback-icmp
    from: r4
    to: 10.255.2.2
    protocol: icmp
    expect_reachable: true
    max_failures: 0
failure_checks:
  - name: r1-loses-r4-after-r3-r4-link-fails
    from: r1
    to: 10.255.4.4
    protocol: icmp
    expect_reachable: false
    max_failures: 1
    failure_domain:
      include_links: ["r3-eth2--r4-eth1"]
