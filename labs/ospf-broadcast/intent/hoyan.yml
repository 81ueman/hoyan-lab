version: hoyan/v1

snapshots:
  current:
    lab: labs/ospf-broadcast

scenarios:
  normal:
    snapshot: current

intents:
  # All OSPF routes are intra_area (single area 0, broadcast network)
  - name: all-ospf-routes-are-intra-area
    scenario: normal
    rcl:
      guard:
        where:
          protocol: ospf
        intent:
          rib_eval:
            aggregate: distVals(route_type)
            eq: [[intra_area]]

  # r1's loopback (10.255.1.1/32) reachable from other 3 routers via OSPF
  - name: r1-loopback-reachable-from-other-routers
    scenario: normal
    rcl:
      rib_eval:
        where:
          protocol: ospf
          prefix: 10.255.1.1/32
        aggregate: count()
        gte: 3

  # r4's loopback (10.255.4.4/32) reachable from all 4 routers via OSPF
  - name: r4-loopback-reachable-from-all-routers
    scenario: normal
    rcl:
      rib_eval:
        where:
          protocol: ospf
          prefix: 10.255.4.4/32
        aggregate: count()
        gte: 4

  # Each router has at least one OSPF nexthop (not just local routes)
  - name: each-router-has-ospf-nexthops
    scenario: normal
    rcl:
      forall:
        var: device
        in: [r1, r2, r3, r4]
        intent:
          rib_eval:
            where:
              protocol: ospf
            aggregate: distCnt(nexthop)
            gte: 1

  # r2 and r3 share the broadcast segment (both have routes via each other)
  - name: broadcast-routers-see-each-other
    scenario: normal
    rcl:
      forall:
        var: device
        in: [r2, r3]
        intent:
          rib_eval:
            where:
              protocol: ospf
              prefix: 198.51.100.0/29
            aggregate: distCnt(nexthop)
            gte: 1
