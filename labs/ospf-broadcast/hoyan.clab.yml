name: hoyan-ospf-broadcast
mgmt:
    network: hoyan-ospf-broadcast
    ipv4-subnet: 172.86.92.0/24
topology:
    kinds:
        linux:
            image: hoyan-frr-nftables:10.6.1
    nodes:
        r1:
            kind: linux
            group: router
            mgmt-ipv4: 172.86.92.11
            binds:
                - configs/frr/r1:/etc/frr:ro
        r2:
            kind: linux
            group: router
            mgmt-ipv4: 172.86.92.12
            binds:
                - configs/frr/r2:/etc/frr:ro
        r3:
            kind: linux
            group: router
            mgmt-ipv4: 172.86.92.13
            binds:
                - configs/frr/r3:/etc/frr:ro
        r4:
            kind: linux
            group: router
            mgmt-ipv4: 172.86.92.14
            binds:
                - configs/frr/r4:/etc/frr:ro
        sw1:
            kind: linux
            group: switch
            mgmt-ipv4: 172.86.92.21
            exec:
                - ip link add br0 type bridge
                - ip link set br0 up
                - ip link set eth1 master br0
                - ip link set eth2 master br0
                - ip link set eth3 master br0
                - ip link set eth1 up
                - ip link set eth2 up
                - ip link set eth3 up
    links:
        - endpoints: ["r1:eth1", "sw1:eth1"]
        - endpoints: ["r2:eth1", "sw1:eth2"]
        - endpoints: ["r3:eth1", "sw1:eth3"]
        - endpoints: ["r3:eth2", "r4:eth1"]
