set / system name host-name r1
set / network-instance tenant-a type ip-vrf
set / network-instance tenant-b type ip-vrf
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 192.0.2.1/30
set / network-instance tenant-a interface ethernet-1/1.0
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 192.0.2.1/30
set / network-instance tenant-b interface ethernet-1/2.0
set / network-instance tenant-a next-hop-groups group tenant-a-nhg nexthop 1 ip-address 192.0.2.2
set / network-instance tenant-a static-routes route 10.255.0.1/32 next-hop-group tenant-a-nhg admin-state enable
set / network-instance tenant-b next-hop-groups group tenant-b-nhg nexthop 1 ip-address 192.0.2.2
set / network-instance tenant-b static-routes route 10.255.0.1/32 next-hop-group tenant-b-nhg admin-state enable
