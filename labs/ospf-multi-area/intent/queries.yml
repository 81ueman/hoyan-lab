route_checks:
  - name: r1-to-r4-loopback-inter-area
    from: r1
    prefix: 10.255.4.4/32
    max_failures: 0
  - name: r4-to-r1-loopback-inter-area
    from: r4
    prefix: 10.255.1.1/32
    max_failures: 0
  - name: r1-to-r6-loopback-inter-area
    from: r1
    prefix: 10.255.6.6/32
    max_failures: 0
  - name: r6-to-r4-loopback-inter-area
    from: r6
    prefix: 10.255.4.4/32
    max_failures: 0
packet_checks:
  - name: r1-to-r4-loopback-icmp
    from: r1
    to: 10.255.4.4
    protocol: icmp
    expect_reachable: true
    max_failures: 0
  - name: r6-to-r1-loopback-icmp
    from: r6
    to: 10.255.1.1
    protocol: icmp
    expect_reachable: true
    max_failures: 0
failure_checks:
  - name: r1-loses-r4-after-backbone-fails
    from: r1
    to: 10.255.4.4
    protocol: icmp
    expect_reachable: false
    max_failures: 1
    failure_domain:
      include_links: ["r2-eth2--r3-eth1"]
  - name: r1-loses-r6-after-area3-abr-link-fails
    from: r1
    to: 10.255.6.6
    protocol: icmp
    expect_reachable: false
    max_failures: 1
    failure_domain:
      include_links: ["r2-eth3--r5-eth1"]
