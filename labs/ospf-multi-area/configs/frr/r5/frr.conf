frr version 10.6.1
frr defaults traditional
hostname r5
service integrated-vtysh-config
!
interface lo
 ip address 10.255.5.5/32
!
interface eth1
 ip address 198.51.100.9/31
 ip ospf cost 1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
interface eth2
 ip address 198.51.100.10/31
 ip ospf cost 1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
router ospf
 ospf router-id 10.255.5.5
 passive-interface lo
 network 10.255.5.5/32 area 0
 network 198.51.100.8/31 area 0
 network 198.51.100.10/31 area 3
!
