frr version 10.6.1
frr defaults traditional
hostname core2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.3.3/32
!
interface eth1
 ip address 192.168.20.1/31
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf mtu-ignore
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
interface eth2
 ip address 192.168.30.0/31
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf mtu-ignore
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
router ospf
 ospf router-id 10.255.3.3
 passive-interface lo
 network 10.255.3.3/32 area 0
 network 192.168.20.0/31 area 0
 network 192.168.30.0/31 area 0
!
router bgp 65000
 no bgp ebgp-requires-policy
 bgp router-id 10.255.3.3
 neighbor 192.168.20.0 remote-as 65000
 neighbor 192.168.30.1 remote-as 65002
 !
 address-family ipv4 unicast
  neighbor 192.168.20.0 activate
  neighbor 192.168.30.1 activate
 exit-address-family
exit
!
