version: hoyan/v1

snapshots:
  current:
    lab: labs/bgp-ospf-igp

scenarios:
  normal:
    snapshot: current

intents:
  # OSPF routes exist on all routers (IGP backbone)
  - name: ospf-routes-on-all-routers
    scenario: normal
    rcl:
      guard:
        where:
          protocol: ospf
          prefix: 10.255.1.1/32
        intent:
          rib_eval:
            aggregate: count()
            gte: 4  # all 4 routers have OSPF route to edge1 loopback

  # BGP routes exist on all routers (propagated via BGP)
  - name: bgp-routes-on-all-routers
    scenario: normal
    rcl:
      guard:
        where:
          protocol: bgp
          prefix: 10.255.4.4/32
        intent:
          rib_eval:
            aggregate: count()
            gte: 4  # all 4 routers have BGP route to edge2 loopback

  # edge1 has BGP route to edge2's loopback (cross-protocol verification)
  - name: edge1-sees-edge2-loopback-via-bgp
    scenario: normal
    rcl:
      guard:
        where:
          device: edge1
          protocol: bgp
          prefix: 10.255.4.4/32
        intent:
          rib_eval:
            aggregate: count()
            gte: 1

  # edge2 has BGP route to edge1's loopback (cross-protocol verification)
  - name: edge2-sees-edge1-loopback-via-bgp
    scenario: normal
    rcl:
      guard:
        where:
          device: edge2
          protocol: bgp
          prefix: 10.255.1.1/32
        intent:
          rib_eval:
            aggregate: count()
            gte: 1

  # Core routers have OSPF routes to edge loopbacks (providing BGP next-hop resolution)
  - name: core-routers-have-ospf-to-loopbacks
    scenario: normal
    rcl:
      forall:
        var: device
        in: [core1, core2]
        intent:
          and:
            - guard:
                where:
                  protocol: ospf
                  prefix: 10.255.1.1/32
                intent:
                  rib_eval:
                    aggregate: count()
                    gte: 1
            - guard:
                where:
                  protocol: ospf
                  prefix: 10.255.4.4/32
                intent:
                  rib_eval:
                    aggregate: count()
                    gte: 1

  # Same prefix has both OSPF and BGP routes (cross-protocol on each router)
  - name: cross-protocol-routes-for-edge1-loopback
    scenario: normal
    rcl:
      forall:
        var: device
        in: [edge1, core1, core2, edge2]
        intent:
          and:
            - guard:
                where:
                  protocol: ospf
                  prefix: 10.255.1.1/32
                intent:
                  rib_eval:
                    aggregate: count()
                    gte: 1
            - guard:
                where:
                  protocol: bgp
                  prefix: 10.255.1.1/32
                intent:
                  rib_eval:
                    aggregate: count()
                    gte: 1
