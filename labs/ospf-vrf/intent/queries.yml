route_checks:
  - name: tenant-a-ospf-service
    from: r1
    vrf: tenant-a
    prefix: 10.10.0.1/32
    max_failures: 0
  - name: tenant-b-ospf-service
    from: r1
    vrf: tenant-b
    prefix: 10.20.0.1/32
    max_failures: 0
packet_checks:
  - name: tenant-a-service-icmp
    from: r1
    vrf: tenant-a
    to: 10.10.0.1
    protocol: icmp
    expect_reachable: true
    max_failures: 0
  - name: tenant-b-service-icmp
    from: r1
    vrf: tenant-b
    to: 10.20.0.1
    protocol: icmp
    expect_reachable: true
    max_failures: 0
  - name: tenant-a-cannot-reach-tenant-b-service
    from: r1
    vrf: tenant-a
    to: 10.20.0.1
    protocol: icmp
    expect_reachable: false
    live_probe: false
    max_failures: 0
  - name: tenant-b-cannot-reach-tenant-a-service
    from: r1
    vrf: tenant-b
    to: 10.10.0.1
    protocol: icmp
    expect_reachable: false
    live_probe: false
    max_failures: 0
