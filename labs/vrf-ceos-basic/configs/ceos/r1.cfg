hostname r1
!
service routing protocols model multi-agent
!
ip routing
!
vrf instance tenant-a
!
vrf instance tenant-b
!
ip routing vrf tenant-a
ip routing vrf tenant-b
!
interface Ethernet1
   no switchport
   vrf tenant-a
   ip address 192.0.2.1/30
!
interface Ethernet2
   no switchport
   vrf tenant-b
   ip address 192.0.2.1/30
!
ip route vrf tenant-a 10.255.0.1/32 192.0.2.2
ip route vrf tenant-b 10.255.0.1/32 192.0.2.2
!
