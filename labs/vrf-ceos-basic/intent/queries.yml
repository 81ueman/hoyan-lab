route_checks:
  - name: tenant-a-static-service
    from: r1
    vrf: tenant-a
    prefix: 10.255.0.1/32
    max_failures: 0
  - name: tenant-b-static-overlap-service
    from: r1
    vrf: tenant-b
    prefix: 10.255.0.1/32
    max_failures: 0
packet_checks:
  - name: tenant-a-service-icmp
    from: r1
    vrf: tenant-a
    to: 10.255.0.1
    protocol: icmp
    expect_reachable: true
    live_probe: false
    max_failures: 0
  - name: tenant-b-overlap-service-icmp
    from: r1
    vrf: tenant-b
    to: 10.255.0.1
    protocol: icmp
    expect_reachable: true
    live_probe: false
    max_failures: 0
failure_checks:
  - name: tenant-a-service-no-failure-budget
    from: r1
    vrf: tenant-a
    to: 10.255.0.1
    protocol: icmp
    expect_reachable: true
    max_failures: 0
