route_checks:
  - name: r1-to-r2-loopback
    from: r1
    prefix: 10.255.2.2/32
    max_failures: 0
packet_checks:
  - name: r1-to-r2-loopback-icmp
    from: r1
    to: 10.255.2.2
    protocol: icmp
    expect_reachable: true
    max_failures: 0
failure_checks:
  - name: r1-reaches-r2-after-r1-r4-fails
    from: r1
    to: 10.255.2.2
    protocol: icmp
    expect_reachable: true
    max_failures: 1
    failure_domain:
      include_links: ["r4-eth1--r1-eth2"]
