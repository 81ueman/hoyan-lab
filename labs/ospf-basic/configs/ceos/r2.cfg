hostname r2
!
service routing protocols model multi-agent
!
ip routing
!
interface Loopback0
   ip address 10.255.2.2/32
!
interface Ethernet1
   no switchport
   ip address 198.51.100.1/31
   ip ospf area 0.0.0.0
   ip ospf cost 10
   ip ospf network point-to-point
   ip ospf hello-interval 1
   ip ospf dead-interval 3
!
interface Ethernet2
   no switchport
   ip address 198.51.100.2/31
   ip ospf area 0.0.0.0
   ip ospf cost 1
   ip ospf network point-to-point
   ip ospf hello-interval 1
   ip ospf dead-interval 3
!
router ospf 1
   router-id 10.255.2.2
   passive-interface Loopback0
   network 10.255.2.2/32 area 0.0.0.0
   network 198.51.100.0/31 area 0.0.0.0
   network 198.51.100.2/31 area 0.0.0.0
!
